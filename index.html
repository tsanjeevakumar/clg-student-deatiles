<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Portal</title>
<style>body{font-family:Arial;padding:20px}input,button{padding:10px;margin:5px;width:90%}#list{margin-top:20px}table{width:100%}</style>
</head><body><h2>Student Portal</h2>
<input id="name" placeholder="Name"><input id="roll" placeholder="Roll No"><input id="branch" placeholder="Branch">
<button onclick="addStudent()">Add Student</button><button onclick="loadStudents()">Refresh List</button>
<div id="msg"></div><div id="list">Loading...</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzESPkLeQFIVqXaAmeuqzTwgkb50Z67a3KcdV3bTjo8tXSui86Ad-xICYXgE-gCGJsx/exec";
async function addStudent(){
 const data={name:document.getElementById('name').value,roll:document.getElementById('roll').value,branch:document.getElementById('branch').value};
 document.getElementById('msg').innerText="Saving...";
 await fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});
 document.getElementById('msg').innerText="Saved Success!";
 setTimeout(loadStudents,2000);
}
async function loadStudents(){
 document.getElementById('list').innerHTML="Loading...";
 try{
  const res=await fetch("https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(API_URL));
  const data=await res.json();
  if(!data.length){document.getElementById('list').innerHTML="No students yet";return;}
  let h="<table border=1 cellpadding=5><tr><th>Name</th><th>Roll</th><th>Branch</th></tr>";
  data.forEach(s=>{h+=`<tr><td>${s.name}</td><td>${s.roll}</td><td>${s.branch}</td></tr>`});
  document.getElementById('list').innerHTML=h+"</table>";
 }catch(e){document.getElementById('list').innerHTML="Check Google Sheet for data";}
}
loadStudents();
</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Student Details</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px;margin:0}
h2{text-align:center}
.box{background:white;padding:20px;max-width:500px;margin:auto;border-radius:10px;box-shadow:0 0 10px #ccc}
input{width:95%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px}
button{background:#007bff;color:white;padding:12px;border:none;border-radius:5px;cursor:pointer;width:100%;margin-top:10px;font-size:16px}
.card{background:#e9f5ff;padding:10px;margin:10px 0;border-radius:5px;border-left:4px solid #007bff}
</style>
</head>
<body>
<h2>CLG Student Details</h2>
<div class="box">
<input id="name" placeholder="Student Name">
<input id="roll" placeholder="Roll No">
<input id="branch" placeholder="Branch CSE/ECE">
<button onclick="addStudent()">Add Student</button>
<hr>
<div id="list"></div>
</div>
<script>
let students = JSON.parse(localStorage.getItem("students")||"[]");
function show(){
 let h="";
 for(let s of students){h+=`<div class=card><b>${s.name}</b><br>Roll: ${s.roll}<br>Branch: ${s.branch}</div>`;}
 document.getElementById("list").innerHTML=h;
}
function addStudent(){
 let n=document.getElementById("name").value;
 let r=document.getElementById("roll").value;
 let b=document.getElementById("branch").value;
 if(!n){alert("Name enter chey");return;}
 students.push({name:n,roll:r,branch:b});
 localStorage.setItem("students",JSON.stringify(students));
 show();
 document.getElementById("name").value="";
 document.getElementById("roll").value="";
 document.getElementById("branch").value="";
}
show();
</script>
</body>
</html>
